<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>116 領袖班宣導簡報</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#121212;color:#f5f1e8;font-family:"Microsoft JhengHei",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#1f1f1f;border-bottom:1px solid #3a3a3a}header strong{font-size:18px;font-weight:600}header a{color:#d9b36c;text-decoration:none;font-size:14px}.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:18px 18px 78px;position:relative}.slide{max-width:min(96vw,1400px);max-height:calc(100vh - 170px);width:auto;height:auto;box-shadow:0 12px 42px #0009;user-select:none}.nav{position:fixed;left:0;right:0;bottom:0;height:68px;background:#1f1f1f;border-top:1px solid #3a3a3a;display:flex;align-items:center;justify-content:center;gap:16px}.nav button{background:#343434;color:#fff;border:1px solid #666;border-radius:7px;padding:9px 18px;font-size:16px;cursor:pointer}.nav button:hover{background:#4a4a4a}.count{min-width:80px;text-align:center;color:#ddd}.hint{position:absolute;bottom:82px;color:#aaa;font-size:13px}@media(max-width:600px){header{padding:0 12px}header strong{font-size:15px}.stage{padding:10px 10px 70px}.slide{max-width:100vw;max-height:calc(100vh - 150px)}.nav{height:60px;gap:8px}.nav button{padding:8px 12px}}
</style></head>
<body>
<header><strong>116 領袖班宣導簡報</strong><a href="./">回到研習成果首頁</a></header>
<main class="stage"><img id="slide" class="slide" src="./leader-slides/slide-01.png" alt="第 1 張投影片"><div class="hint">使用 ← → 鍵或下方按鈕翻頁</div></main>
<nav class="nav"><button id="prev" type="button">上一張</button><span id="count" class="count">1 / 16</span><button id="next" type="button">下一張</button></nav>
<script>
const total=16;let current=1;const img=document.getElementById('slide'),count=document.getElementById('count');
function show(n){current=Math.max(1,Math.min(total,n));const id=String(current).padStart(2,'0');img.src=`./leader-slides/slide-${id}.png`;img.alt=`第 ${current} 張投影片`;count.textContent=`${current} / ${total}`;}
document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')show(current-1);if(e.key==='ArrowRight'||e.key===' ')show(current+1);});
let startX=null;document.querySelector('.stage').addEventListener('touchstart',e=>startX=e.touches[0].clientX,{passive:true});document.querySelector('.stage').addEventListener('touchend',e=>{if(startX===null)return;const dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>40)show(current+(dx<0?1:-1));startX=null},{passive:true});
</script></body></html>
